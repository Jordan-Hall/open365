[workspace]
resolver = "3"
members = [
    "crates/opc",
    "crates/docx",
    "crates/xlsx",
    "crates/commands",
    "crates/testkit",
    "apps/cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
open365-opc = { path = "crates/opc" }
open365-docx = { path = "crates/docx" }
open365-xlsx = { path = "crates/xlsx" }
open365-commands = { path = "crates/commands" }
open365-testkit = { path = "crates/testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
