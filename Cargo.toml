[workspace]
resolver = "3"
exclude = ["fuzz"]
members = [
    "crates/locale",
    "crates/opc",
    "crates/docx",
    "crates/xlsx",
    "crates/chart",
    "crates/pivot",
    "crates/calc",
    "crates/text",
    "crates/spell",
    "crates/layout",
    "crates/pdf",
    "crates/drawing",
    "crates/commands",
    "crates/mcp",
    "crates/ui-egui",
    "crates/ui-shell",
    "crates/gfx",
    "crates/ui-host",
    "crates/ui-core",
    "crates/testkit",
    "crates/robustness",
    "crates/server",
    "apps/cli",
    "apps/desktop",
    "apps/writer",
    "apps/sheets",
    "apps/preview",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
open365-locale = { path = "crates/locale" }
open365-opc = { path = "crates/opc" }
open365-docx = { path = "crates/docx" }
open365-xlsx = { path = "crates/xlsx" }
open365-chart = { path = "crates/chart" }
open365-pivot = { path = "crates/pivot" }
open365-calc = { path = "crates/calc" }
open365-text = { path = "crates/text" }
open365-spell = { path = "crates/spell" }
open365-layout = { path = "crates/layout" }
open365-pdf = { path = "crates/pdf" }
open365-drawing = { path = "crates/drawing" }
open365-commands = { path = "crates/commands" }
open365-mcp = { path = "crates/mcp" }
open365-ui-egui = { path = "crates/ui-egui" }
open365-ui-shell = { path = "crates/ui-shell" }
open365-gfx = { path = "crates/gfx" }
open365-ui-host = { path = "crates/ui-host" }
open365-ui-core = { path = "crates/ui-core" }
open365-testkit = { path = "crates/testkit" }
open365-server = { path = "crates/server" }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "wgpu", "wayland", "x11"] }
egui = { version = "0.36", default-features = false }
egui_kittest = "0.36"
flate2 = "1.1.10"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
harfrust = "0.12"
skrifa = "0.44"
unicode-linebreak = "0.1.5"
rfd = "0.17"
# Safe registry reads (MIT OR Apache-2.0, Microsoft windows-rs): caret settings and the app theme.
windows-registry = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
# Own UI platform (ADR docs/architecture/adr-ui-platform.md). wgpu and winit track the versions eframe 0.36
# resolves, so the tree holds one wgpu and one winit while egui still builds. Backends are chosen per crate.
wgpu = { version = "30.0", default-features = false, features = ["std", "parking_lot", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland"] }
accesskit = "0.24"
accesskit_winit = "0.32"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
# Text clipboard for the winit host (MIT OR Apache-2.0). Safe public API; text only, so no image stack.
arboard = { version = "3", default-features = false }

# Share-link server (open365-server, ADR-013 Stage 1). Licences verified in adr-sharing.md section 3a.
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json", "query"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.3"
subtle = "2.6"
tempfile = "3"
http-body-util = "0.1"
sha1 = "0.10"
ring = "0.17"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
proptest = { version = "1", default-features = false, features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
