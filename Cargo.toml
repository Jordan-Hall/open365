[workspace]
resolver = "3"
members = [
    "crates/opc",
    "crates/docx",
    "crates/xlsx",
    "crates/calc",
    "crates/text",
    "crates/layout",
    "crates/commands",
    "crates/ui-egui",
    "crates/testkit",
    "apps/cli",
    "apps/desktop",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
open365-opc = { path = "crates/opc" }
open365-docx = { path = "crates/docx" }
open365-xlsx = { path = "crates/xlsx" }
open365-calc = { path = "crates/calc" }
open365-text = { path = "crates/text" }
open365-layout = { path = "crates/layout" }
open365-commands = { path = "crates/commands" }
open365-ui-egui = { path = "crates/ui-egui" }
open365-testkit = { path = "crates/testkit" }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "wgpu", "wayland", "x11"] }
egui = { version = "0.36", default-features = false }
egui_kittest = "0.36"
fontdb = "0.24"
harfrust = "0.12"
skrifa = "0.44"
unicode-linebreak = "0.1.5"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
