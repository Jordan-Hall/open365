# The accounting formats pad with `*` fill. The fill count comes from glyph widths measured in the oracle's font
# (crates/calc/src/numfmt/mod.rs, `glyph_units`); the negative section `_(* (#,##0)` ends in `)` instead of a
# padding space and Open365 fills one space too few (probed: Excel 170 characters, Open365 169).
[[difference]]
id = "numfmt.pad.052"
reason = "Fill width of the negative accounting section is one space short; parenthesis glyph widths are not exact."

[[difference]]
id = "numfmt.builtin.164"
reason = "Same as numfmt.pad.052."

[[difference]]
id = "numfmt.builtin.171"
reason = "Same as numfmt.pad.052."

[[difference]]
id = "numfmt.builtin.178"
reason = "Same as numfmt.pad.052."

[[difference]]
id = "numfmt.builtin.185"
reason = "Same as numfmt.pad.052."

[[difference]]
id = "text.fmt_bool"
reason = "TEXT(1,TRUE): the format text is `TRUE`; Excel's TEXT refuses it (#VALUE!, an uppercase `E` is not a format letter) while Open365's format parser reads `E` as the era year."

[[difference]]
id = "text.fmt_text_only"
reason = "TEXT(5,\"abc\") is `a43c` in Excel (`b` is the Buddhist-calendar year, `a` and `c` literals); numfmt has no `b` code and refuses the format, so Open365 returns #VALUE!."

[[difference]]
id = "text.fmt_invalid3"
reason = "TEXT refuses four decimals on seconds (`ss.0000`, #VALUE!); numfmt accepts any number of them."

[[difference]]
id = "text.fmt_nested_bracket"
reason = "TEXT refuses two colour codes in one section (`[Red][Blue]0`, #VALUE!); numfmt accepts and ignores the second."


[[difference]]
id = "refarr.s_indtxt_48"
reason = "SUM(IFERROR(INDIRECT({\"G1\",\"A1\"}),\"e\")) is #VALUE! in Excel: IFERROR lifts over an array of references holding a text cell, and the rule behind the error is unknown."

[[difference]]
id = "refarr.s_indbool_48"
reason = "SUM(IFERROR(INDIRECT({\"H4\",\"A1\"}),\"e\")) is 1 in Excel (the TRUE cell counts, the number does not); the rule behind it is unknown."

