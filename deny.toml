# cargo-deny policy. Open365 is MIT; dependencies must be permissive.
# Adding a licence here is an architecture decision: record it in docs/architecture/decision-log.md.

[advisories]
yanked = "deny"

# Text stack (open365-text): harfrust MIT, skrifa/read-fonts MIT OR Apache-2.0, unicode-linebreak Apache-2.0,
# all covered by the allow list below; no new licence was needed.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # BSL-1.0 (Boost, OSI approved, permissive): clipboard-win and error-code, pulled in by
    # egui-winit -> arboard on Windows (ADR-004 UI stack).
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
