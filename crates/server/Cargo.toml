[package]
name = "open365-server"
description = "Self-hosted sharing server (ADR-013 Stage 1): tenants, accounts, versioned documents, ACLs, share links, audit log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "open365_server"
path = "src/lib.rs"

[[bin]]
name = "open365-server"
path = "src/main.rs"

[features]
default = ["oidc"]
# OpenID Connect sign-in (Authorization Code + PKCE). The only outbound requests the server makes, and only to the
# configured issuer.
oidc = ["dep:ring"]

[dependencies]
axum.workspace = true
axum-server.workspace = true
tokio.workspace = true
tower.workspace = true
rustls.workspace = true
rusqlite.workspace = true
argon2.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
base64.workspace = true
getrandom.workspace = true
subtle.workspace = true
serde.workspace = true
serde_json.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
ring = { workspace = true, optional = true }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
rcgen.workspace = true
ring.workspace = true

[lints]
workspace = true
