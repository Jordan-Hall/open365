[package]
name = "open365-preview"
description = "Side-by-side preview of the Open365 chrome on the own UI platform (winit, wgpu, ui-core): open365-writer-next and open365-sheets-next."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "open365-writer-next"
path = "src/bin/writer.rs"

[[bin]]
name = "open365-sheets-next"
path = "src/bin/sheets.rs"

[dependencies]
open365-branding.workspace = true
accesskit.workspace = true
image.workspace = true
open365-calc.workspace = true
open365-chart.workspace = true
open365-clipboard.workspace = true
open365-commands.workspace = true
open365-docx.workspace = true
open365-drawing.workspace = true
open365-gfx.workspace = true
open365-layout.workspace = true
open365-locale.workspace = true
open365-opc.workspace = true
open365-print.workspace = true
open365-spell.workspace = true
open365-text.workspace = true
open365-ui-core.workspace = true
open365-ui-host.workspace = true
open365-xlsx.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
open365-pivot.workspace = true
image.workspace = true
open365-opc.workspace = true

[build-dependencies]
open365-branding.workspace = true
winresource = { version = "0.1.31", default-features = false }

[lints]
workspace = true
