[package]
name = "open365-cli"
description = "open365 command-line interface for inspecting and round-tripping documents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "open365"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
open365-commands.workspace = true
open365-opc.workspace = true
open365-testkit.workspace = true
serde_json.workspace = true

[dev-dependencies]
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true
