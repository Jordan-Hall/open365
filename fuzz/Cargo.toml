[package]
name = "open365-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
open365-opc = { path = "../crates/opc" }
open365-docx = { path = "../crates/docx" }
open365-xlsx = { path = "../crates/xlsx" }
open365-calc = { path = "../crates/calc" }

# Own workspace: the root workspace lists this directory in `exclude`, and fuzzing needs nightly.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "opc_open"
path = "fuzz_targets/opc_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx_load"
path = "fuzz_targets/docx_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xlsx_load"
path = "fuzz_targets/xlsx_load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "calc_formula"
path = "fuzz_targets/calc_formula.rs"
test = false
doc = false
bench = false
